<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SleepOutside | Log In</title>
    <link rel="stylesheet" href="/styles/style.css"/>
</head>
<body>
    <main>
        <h1>Log In</h1>
        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required></label>
            </div>
            <div id="formError" class="error" aria-live="polite"></div>
            <button type="submit">Log In</button>
            <p>New here? <a href="/customer_registration/signup.html">Create an account</a></p>
        </form>
    </main>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
